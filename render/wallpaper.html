<!doctype html>
<meta charset="utf-8">
<title>Peacocks in Space wallpaper</title>
<!-- Rendered headless by generate.py --assets: wallpaper.html?theme=<id>&kind=eye|plumage|nebula -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<canvas id="wallpaper" width="3840" height="2160"></canvas>
<script src="themes.js"></script>
<script>
"use strict";

const params = new URLSearchParams(location.search);
const theme = window.THEMES[params.get("theme") || "peacocks-in-space"];
const kind = params.get("kind") || "eye";
const W = 3840, H = 2160;
const ctx = document.getElementById("wallpaper").getContext("2d");
const WP = theme.wallpaper, F = theme.feather;
const dark = WP.mode === "dark";

/* ---------- helpers ---------- */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const mixHex = (a, b, t) => {
  const A = hex(a), B = hex(b);
  return "#" + A.map((v, i) => Math.round(v * (1 - t) + B[i] * t).toString(16).padStart(2, "0")).join("");
};
const smooth = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };

// Value noise with smooth interpolation, summed into fractal Brownian motion.
function makeNoise(rng) {
  const vals = new Float32Array(256), perm = new Uint8Array(512);
  for (let i = 0; i < 256; i++) { vals[i] = rng(); perm[i] = i; }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const lat = (x, y) => vals[perm[perm[x & 255] + (y & 255)]];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = lat(xi, yi), b = lat(xi + 1, yi), c = lat(xi, yi + 1), d = lat(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(noise, x, y, octaves) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) { sum += amp * noise(x * freq, y * freq); norm += amp; amp *= 0.5; freq *= 2.03; }
  return sum / norm;
}

/* ---------- layers ---------- */
function base() {
  const g = ctx.createLinearGradient(0, 0, W * 0.25, H);
  g.addColorStop(0, WP.top);
  g.addColorStop(1, WP.bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function nebula(color, seed, { scale = 2.2, threshold = 0.5, gain = 3.2, alpha = 0.5, warp = 1.4 } = {}) {
  const w = 960, h = 540;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const o = off.getContext("2d");
  const img = o.createImageData(w, h);
  const rng = mulberry32(seed);
  const n1 = makeNoise(rng), n2 = makeNoise(rng);
  const tint = dark ? color : mixHex(color, "#ffffff", 0.45);
  const [r, g, b] = hex(tint);
  const strength = alpha * WP.nebula * 2 * 255;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nx = (x / w) * scale * (W / H), ny = (y / h) * scale;
      const wv = fbm(n2, nx + 3.1, ny + 1.7, 3) * warp;
      const v = fbm(n1, nx + wv, ny - wv, 7);
      const a = smooth((v - threshold) * gain);
      const i = (y * w + x) * 4;
      img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b;
      img.data[i + 3] = Math.round(a * strength);
    }
  }
  o.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = dark ? "screen" : "multiply";
  ctx.filter = "blur(10px)";
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, -30, -30, W + 60, H + 60);
  ctx.restore();
}

function stars(seed, count) {
  const rng = mulberry32(seed);
  ctx.save();
  if (!dark) {
    // Light variant: faint dust instead of stars.
    for (let i = 0; i < count * 0.5; i++) {
      ctx.fillStyle = rgba("#6e7a94", 0.08 + rng() * 0.12);
      ctx.beginPath(); ctx.arc(rng() * W, rng() * H, 0.8 + rng() * 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return;
  }
  for (let i = 0; i < count * WP.stars; i++) {
    const x = rng() * W, y = rng() * H, m = rng();
    const r = m < 0.93 ? 0.7 + rng() * 1.1 : 1.8 + rng() * 1.8;
    const t = rng();
    const col = t < 0.78 ? "#ffffff" : t < 0.9 ? F.teal_bright : "#ffc9b8";
    ctx.fillStyle = rgba(col, Math.min(1, (0.3 + rng() * 0.6) * WP.stars));
    ctx.shadowColor = rgba(col, 0.9);
    ctx.shadowBlur = r > 1.8 ? r * 7 : 0;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Colour field of a peacock eye. Barbs are stroked with it, so the eye emerges from
// the filaments themselves; the focus sits low, where a real ocellus keeps its heart.
function eyeField(o, R) {
  const g = o.createRadialGradient(0, R * 0.38, 0, 0, 0, R * 2.3);
  const deep = mixHex(F.teal, "#0b2626", 0.55);
  g.addColorStop(0.0, F.core);
  g.addColorStop(0.085, F.core);
  g.addColorStop(0.125, F.blue);
  g.addColorStop(0.17, F.teal_bright);
  g.addColorStop(0.205, F.teal);
  g.addColorStop(0.245, F.bronze);
  g.addColorStop(0.3, mixHex(F.bronze, "#2a120a", 0.35));
  g.addColorStop(0.34, F.gold);
  g.addColorStop(0.41, mixHex(F.lime, F.gold, 0.3));
  g.addColorStop(0.5, mixHex(F.lime, F.teal, 0.5));
  g.addColorStop(0.65, mixHex(F.teal, "#1b4d3e", 0.3));
  g.addColorStop(1.0, deep);
  return g;
}

// A peacock feather: eye at (cx, cy), shaft running `len` px toward `angle` (0 = straight down).
function feather(cx, cy, R, angle, len, alpha = 1, seed = 1) {
  const padTop = R * 2.1, half = R * 2.1;
  const off = document.createElement("canvas");
  off.width = Math.ceil(half * 2);
  off.height = Math.ceil(padTop + len + R * 0.3);
  const o = off.getContext("2d");
  o.translate(half, padTop);
  const rng = mulberry32(seed);
  const field = eyeField(o, R);

  // Soft underlay so the eye reads as a solid ocellus between the filaments.
  o.save();
  o.filter = `blur(${Math.max(3, R / 30)}px)`;
  o.globalAlpha = 0.55;
  o.fillStyle = field;
  o.beginPath(); o.ellipse(0, R * 0.2, R * 0.6, R * 0.74, 0, 0, Math.PI * 2); o.fill();
  o.restore();

  // Barbs. The crown is a circle around the eye; below it the vane tapers to the base.
  const C = -0.3 * R, Rc = 1.45 * R, top = C - Rc * 0.98;
  const step = Math.max(1.4, R / 150);
  o.lineCap = "round";
  o.lineWidth = Math.max(1, R / 240);
  o.strokeStyle = field;
  for (let y = top; y < len; y += step) {
    const thetaDeg = y < 0 ? 12 + 46 * smooth((y - top) / (C + Rc * 0.2 - top)) : 58 + 12 * Math.min(1, y / len);
    for (const side of [-1, 1]) {
      const th = ((thetaDeg + (rng() - 0.5) * 6) * Math.PI) / 180;
      const dy = y - C, ct = Math.cos(th), st = Math.sin(th);
      let blen;
      if (Math.abs(dy) < Rc) {
        // Longest segment from (0, y) along the barb that stays inside the crown circle.
        const b = dy * ct;
        blen = b + Math.sqrt(Math.max(0, b * b - dy * dy + Rc * Rc));
      } else {
        blen = 0;
      }
      const taper = R * 1.15 * Math.max(0.08, 1 - (y - R) / (len - R) * 0.95);
      if (y > R * 0.4) blen = Math.max(blen, taper / st);
      blen *= 0.9 + rng() * 0.12;
      if (blen < 3) continue;
      const ex = side * blen * st, ey = y - blen * ct;
      o.globalAlpha = (0.5 + rng() * 0.45) * (1 - 0.6 * smooth((y - R * 1.1) / (len * 0.55)));
      o.beginPath();
      o.moveTo(0, y);
      o.quadraticCurveTo(side * blen * 0.55 * st, y - blen * 0.32 * ct - blen * 0.08, ex, ey);
      o.stroke();
    }
  }

  // Shaft.
  o.globalAlpha = 1;
  const shaftCol = dark ? "#e8e2cf" : "#3b3226";
  const shaft = o.createLinearGradient(0, R * 0.95, 0, len);
  shaft.addColorStop(0, rgba(shaftCol, 0));
  shaft.addColorStop(0.1, rgba(shaftCol, 0.7));
  shaft.addColorStop(1, rgba(shaftCol, 0.35));
  o.strokeStyle = shaft;
  o.lineWidth = Math.max(1.5, R / 95);
  o.beginPath(); o.moveTo(0, R * 0.95); o.lineTo(0, len); o.stroke();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;
  if (dark) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.8);
    glow.addColorStop(0, rgba(F.teal, 0.16));
    glow.addColorStop(1, rgba(F.teal, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(-R * 2.8, -R * 2.8, R * 5.6, R * 5.6);
    ctx.restore();
  }
  ctx.drawImage(off, -half, -padTop);
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W * 0.55, H * 0.45, H * 0.35, W * 0.5, H * 0.5, W * 0.72);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, dark ? "rgba(0,0,0,0.5)" : rgba("#9dacc7", 0.28));
  ctx.save();
  if (!dark) ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// Fine grain so gradients survive JPEG compression without banding.
function grain(seed) {
  const rng = mulberry32(seed);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rng() - 0.5) * 5;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

/* ---------- compositions ---------- */
function eyeWallpaper() {
  base();
  nebula(F.teal, 11, { threshold: 0.52, alpha: 0.5 });
  nebula(F.orange, 23, { threshold: 0.6, alpha: 0.3, scale: 1.8 });
  nebula(F.blue, 37, { threshold: 0.55, alpha: 0.3, scale: 2.6 });
  stars(5, 1500);
  feather(W * 0.7, H * 0.36, 420, 0.24, 2300, 1, 101);
  vignette();
}

function plumageWallpaper() {
  base();
  nebula(F.teal, 41, { threshold: 0.55, alpha: 0.35 });
  nebula(F.orange, 53, { threshold: 0.62, alpha: 0.22, scale: 1.6 });
  stars(9, 900);
  const bx = W * 0.5, by = H * 1.32;
  const rows = [
    { d: 2150, R: 170, count: 9, spread: 64, alpha: 0.65 },
    { d: 1560, R: 205, count: 6, spread: 48, alpha: 0.85 },
    { d: 980, R: 240, count: 3, spread: 26, alpha: 1 },
  ];
  let seed = 300;
  for (const row of rows) {
    for (let i = 0; i < row.count; i++) {
      const t = row.count === 1 ? 0.5 : i / (row.count - 1);
      const a = ((-row.spread + 2 * row.spread * t) * Math.PI) / 180;
      const cx = bx + row.d * Math.sin(a), cy = by - row.d * Math.cos(a);
      feather(cx, cy, row.R, a, row.d, row.alpha, seed++);
    }
  }
  vignette();
}

function nebulaWallpaper() {
  base();
  nebula(F.teal, 61, { threshold: 0.47, alpha: 0.6, scale: 2 });
  nebula(F.orange, 73, { threshold: 0.55, alpha: 0.45, scale: 1.7 });
  nebula(F.lime, 89, { threshold: 0.6, alpha: 0.25, scale: 2.8 });
  nebula(F.blue, 97, { threshold: 0.52, alpha: 0.4, scale: 1.4 });
  stars(13, 2600);
  vignette();
}

({ eye: eyeWallpaper, plumage: plumageWallpaper, nebula: nebulaWallpaper })[kind]();
grain(3);
document.title = "done";
</script>

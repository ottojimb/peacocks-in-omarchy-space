<!doctype html>
<meta charset="utf-8">
<title>Peacocks in Space preview</title>
<!-- Rendered headless by generate.py --assets (1600x900 at 1.125x = 1800x1012): preview.html?theme=<id> -->
<style>
  html, body { margin: 0; overflow: hidden; background: #000; }
  #desk { position: relative; width: 1600px; height: 900px; overflow: hidden;
    font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace; background-size: cover; background-position: center; }
  #desk * { box-sizing: border-box; }
  .ring { position: absolute; inset: 0; pointer-events: none; border: 2px solid transparent; background: var(--ring) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); mask-composite: exclude; }
  .win { position: absolute; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; }
  .bar svg { width: 14px; height: 14px; display: block; }
  .ws { display: flex; gap: 2px; margin-left: 10px; }
  .ws span { width: 20px; text-align: center; }
  .ws i { width: 9px; height: 9px; border-radius: 2px; background: currentColor; display: inline-block; }
  .right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .center { position: absolute; left: 50%; transform: translateX(-50%); }
  .code { font-size: 13px; line-height: 19px; white-space: pre; }
  .term { font-size: 12.5px; line-height: 18px; white-space: pre; }
  .bx { position: relative; border: 1px solid; border-radius: 6px; padding: 12px 8px 6px; min-height: 0; }
  .bx-t { position: absolute; top: -8px; left: 10px; padding: 0 4px; font-size: 11.5px; line-height: 15px; }
  .meter { height: 7px; overflow: hidden; }
  .meter span { display: block; height: 100%; }
</style>
<div id="desk"></div>
<script src="themes.js"></script>
<script>
"use strict";

const params = new URLSearchParams(location.search);
const theme = window.THEMES[params.get("theme") || "peacocks-in-space"];
const c = theme.colors, S = theme.syntax;

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Hyprland gradient spec ("#a #b 45deg") to CSS. Hyprland 0deg runs left to right.
const paint = (spec) => {
  const parts = spec.trim().split(/\s+/); let ang = 0; const cols = [];
  for (const p of parts) { if (/deg$/.test(p)) ang = parseFloat(p); else cols.push(p); }
  return cols.length === 1 ? cols[0] : `linear-gradient(${ang + 90}deg, ${cols.join(", ")})`;
};
const ring = (spec) => `<i class="ring" style="--ring:${paint(spec)}"></i>`;

/* ---------- Neovim with Rainglow syntax roles ---------- */
const ROLE = {
  comment: S.comment, kw: S.teal, kwImport: S.teal, kwFn: S.teal, cond: S.teal, op: S.teal, tpl: S.teal,
  kwMod: S.orange, type: S.orange, bool: S.orange, builtin: S.orange,
  str: S.lime, fn: S.lime, num: S.lime,
  const: S.fg, prop: S.fg, member: S.fg, param: S.fg, var: S.fg, punc: S.fg, _: S.fg,
};
const CODE = [
  [["comment", "// peacocks-in-space → omarchy"]],
  [["kwImport", "import"], ["punc", " { "], ["var", "readFile"], ["punc", " } "], ["kwImport", "from"], ["_", " "], ["str", '"node:fs/promises"'], ["punc", ";"]],
  [["kwImport", "import"], ["_", " "], ["kw", "type"], ["punc", " { "], ["type", "Palette"], ["punc", " } "], ["kwImport", "from"], ["_", " "], ["str", '"./types"'], ["punc", ";"]],
  [],
  [["kw", "type"], ["_", " "], ["type", "Variant"], ["op", " = "], ["str", '"dark"'], ["op", " | "], ["str", '"contrast"'], ["op", " | "], ["str", '"light"'], ["punc", ";"]],
  [],
  [["kw", "export"], ["_", " "], ["kw", "const"], ["_", " "], ["const", "ACCENT"], ["op", " = "], ["str", '"#26a6a6"'], ["punc", ";"]],
  [["kw", "const"], ["_", " "], ["const", "GAPS"], ["op", " = "], ["punc", "{ "], ["prop", "inner"], ["punc", ": "], ["num", "5"], ["punc", ", "], ["prop", "outer"], ["punc", ": "], ["num", "10"], ["punc", " };"]],
  [],
  [["comment", "/** Load a Rainglow theme and map it to Omarchy roles. */"]],
  [["kw", "export"], ["_", " "], ["kwMod", "async"], ["_", " "], ["kwFn", "function"], ["_", " "], ["fn", "loadPalette"], ["punc", "("], ["param", "variant"], ["punc", ": "], ["type", "Variant"], ["punc", "): "], ["type", "Promise"], ["punc", "<"], ["type", "Palette"], ["punc", "> {"]],
  [["_", "  "], ["kw", "const"], ["_", " "], ["var", "raw"], ["op", " = "], ["kw", "await"], ["_", " "], ["fn", "readFile"], ["punc", "("], ["str", "`themes/"], ["tpl", "${"], ["param", "variant"], ["tpl", "}"], ["str", ".json`"], ["punc", ", "], ["str", '"utf8"'], ["punc", ");"]],
  [["_", "  "], ["kw", "const"], ["_", " "], ["var", "theme"], ["op", " = "], ["builtin", "JSON"], ["punc", "."], ["fn", "parse"], ["punc", "("], ["var", "raw"], ["punc", ");"]],
  [],
  [["_", "  "], ["cond", "if"], ["punc", " ("], ["op", "!"], ["var", "theme"], ["punc", "."], ["member", "colors"], ["punc", ") {"]],
  [["_", "    "], ["cond", "throw"], ["_", " "], ["kw", "new"], ["_", " "], ["type", "Error"], ["punc", "("], ["str", "`missing colors in "], ["tpl", "${"], ["param", "variant"], ["tpl", "}"], ["str", "`"], ["punc", ");"]],
  [["_", "  "], ["punc", "}"]],
  [],
  [["_", "  "], ["kw", "return"], ["punc", " {"]],
  [["_", "    "], ["prop", "accent"], ["punc", ": "], ["const", "ACCENT"], ["punc", ","]],
  [["_", "    "], ["prop", "background"], ["punc", ": "], ["var", "theme"], ["punc", "."], ["member", "colors"], ["punc", "["], ["str", '"editor.background"'], ["punc", "],"]],
  [["_", "    "], ["cursor", "g"], ["prop", "ap"], ["punc", ": "], ["const", "GAPS"], ["punc", "."], ["member", "inner"], ["op", " * "], ["num", "2"], ["punc", ","]],
  [["_", "    "], ["prop", "light"], ["punc", ": "], ["param", "variant"], ["op", " === "], ["str", '"light"'], ["punc", ","]],
  [["_", "    "], ["prop", "ready"], ["punc", ": "], ["bool", "true"], ["punc", ","]],
  [["_", "  "], ["punc", "};"]],
  [["punc", "}"]],
  [],
  [["fn", "loadPalette"], ["punc", "("], ["str", '"dark"'], ["punc", ")."], ["fn", "then"], ["punc", "(("], ["param", "p"], ["punc", ") "], ["op", "=>"], ["_", " "], ["builtin", "console"], ["punc", "."], ["fn", "log"], ["punc", "("], ["param", "p"], ["punc", "."], ["member", "accent"], ["punc", "));"]],
];
const CUR = 22, SEL_FROM = 20, SEL_TO = 22;

function nvim() {
  const tok = ([role, text]) => role === "cursor"
    ? `<span style="background:${c.bright_foreground};color:${c.background}">${esc(text)}</span>`
    : `<span style="color:${ROLE[role] || S.fg}">${esc(text)}</span>`;
  const rows = CODE.map((toks, i) => {
    const n = i + 1, isCur = n === CUR, sel = n >= SEL_FROM && n <= SEL_TO;
    const num = String(isCur ? n : Math.abs(n - CUR)).padStart(3, " ");
    const nStyle = isCur ? `color:${c.orange};font-weight:700` : `color:${c.muted}`;
    return `<div><span style="${nStyle}">  ${num} </span><span style="${sel ? `background:${c.selection};` : ""}">${toks.map(tok).join("")}${sel ? " " : ""}</span></div>`;
  }).join("");
  const tab = (name, on) => `<span style="padding:0 14px;display:inline-flex;align-items:center;height:22px;${on ? `background:${c.background};color:${c.foreground};font-weight:700` : `color:${c.muted}`}">${name}</span>`;
  const mode = `background:${c.magenta};color:${c.background};font-weight:700;padding:0 10px;height:100%;display:flex;align-items:center`;
  const seg = `background:${c.lighter_background};padding:0 10px;height:100%;display:flex;align-items:center`;
  return `<div style="position:absolute;inset:2px;display:flex;flex-direction:column;color:${c.foreground}">
    <div style="height:22px;background:${c.dark_background};display:flex;font-size:12px">${tab("loadPalette.ts", true)}${tab("colors.toml", false)}${tab("neovim.lua", false)}</div>
    <div class="code" style="flex:1;padding-top:6px">${rows}</div>
    <div style="height:22px;display:flex;align-items:center;font-size:12px;background:${c.dark_background}">
      <span style="${mode}">V-LINE</span><span style="${seg}">⎇ main</span><span style="padding:0 10px">loadPalette.ts</span>
      <span style="margin-left:auto;color:${c.muted};padding:0 10px">typescript</span><span style="${seg}">79%</span><span style="${mode}">22:5</span>
    </div>
    <div style="height:19px;font-size:12px;padding-left:8px;color:${c.muted}">-- VISUAL LINE --</div>
  </div>`;
}

/* ---------- Terminal: starship prompt, eza and git diff ---------- */
function terminal() {
  const s = (col, text, st = "") => `<span style="color:${col};${st.includes("b") ? "font-weight:700;" : ""}${st.includes("i") ? "font-style:italic;" : ""}">${esc(text)}</span>`;
  const perm = (p) => [...p].map((ch, i) => {
    if (ch === "-") return s(c.muted, ch);
    if (i === 0) return ch === "d" ? s(c.blue, ch, "b") : ch === "l" ? s(c.cyan, ch) : s(c.muted, ch);
    return s(ch === "r" ? c.yellow : ch === "w" ? c.red : c.green, ch, ch === "x" ? "b" : "");
  }).join("");
  const prompt = (cmd) => s(c.cyan, "peacocks-in-omarchy-space", "b") + " " + s(c.cyan, "main", "i") + " " + s(c.cyan, "? ") + s(c.cyan, "❯", "b") + s(c.foreground, cmd ? " " + cmd : " ");
  const row = (p, size, sizeCol, git, gitCol, name) => perm(p) + " " + s(sizeCol, size.padStart(4)) + " " + s(c.yellow, "ottojimb", "b") + " " + s(c.blue, "26 Oct 11:58") + " " + s(gitCol, git) + " " + name;
  const lines = [
    prompt("eza -la --git"),
    row("drwxr-xr-x", "-", c.muted, "--", c.muted, s(c.blue, "backgrounds", "b")),
    row(".rw-r--r--", "1.4k", c.green, "-M", c.blue, s(c.foreground, "colors.toml")),
    row(".rwxr-xr-x", "812", c.green, "--", c.muted, s(c.green, "install.sh", "b")),
    row("lrwxrwxrwx", "-", c.muted, "--", c.muted, s(c.cyan, "current") + s(c.foreground, " -> ") + s(c.blue, "~/.local/state/omarchy")),
    row(".rw-r--r--", "4.2k", c.green, "-N", c.green, s(c.foreground, "neovim.lua")),
    "",
    prompt("git diff colors.toml"),
    s(c.foreground, "diff --git a/colors.toml b/colors.toml", "b"),
    s(c.cyan, "@@ -1,4 +1,4 @@"),
    s(c.foreground, ` mode = "${c.mode}"`),
    s(c.red, '-accent = "#ff5d38"'),
    s(c.green, `+accent = "${c.accent}"`),
    s(c.foreground, ` selection = "${c.selection}"`),
    "",
    prompt("") + `<span style="background:${c.bright_foreground}"> </span>`,
  ];
  return `<div class="term" style="position:absolute;inset:2px;padding:10px 12px;color:${c.foreground}">${lines.map((l) => `<div>${l || " "}</div>`).join("")}</div>`;
}

/* ---------- btop, following Omarchy's btop.theme template ---------- */
function btop() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  let h = 0.35;
  const cols = Array.from({ length: 80 }, () => { h = Math.min(0.95, Math.max(0.08, h + (rnd() - 0.5) * 0.28)); return h; });
  const graph = cols.map((v) => `<span style="flex:1;height:${(v * 100).toFixed(0)}%;background:linear-gradient(to top, ${c.cyan}, ${c.blue}, ${c.magenta});background-size:100% 104px;background-position:bottom"></span>`).join("");
  const meter = (pct, a, b, d) => `<div class="meter" style="background:${c.selection}"><span style="width:${pct}%;background:linear-gradient(90deg, ${a}, ${b}, ${d})"></span></div>`;
  const title = (n, label) => `<span class="bx-t" style="background:${c.background};color:${c.foreground}"><span style="color:${c.accent}">${n}</span>${label}</span>`;
  const memRow = (label, val, pct, a, b, d) => `<div style="display:grid;gap:3px"><div style="display:flex;justify-content:space-between"><span>${label}</span><span style="color:${c.light_foreground}">${val}</span></div>${meter(pct, a, b, d)}</div>`;
  const procs = [["1841", "Hyprland", "12.4"], ["2210", "alacritty", "6.1"], ["2307", "nvim", "4.8"], ["3120", "btop", "2.2"], ["981", "pipewire", "1.0"], ["1203", "omarchy-shell", "0.8"], ["1377", "chromium", "0.6"]];
  const procRows = procs.map(([pid, name, cpu], i) => {
    const on = i === 1;
    return `<div style="display:grid;grid-template-columns:44px 1fr 40px;gap:6px;padding:1px 4px;${on ? `background:${c.selection};color:${c.accent};font-weight:700` : ""}"><span style="${on ? "" : `color:${c.light_foreground}`}">${pid}</span><span>${name}</span><span style="text-align:right">${cpu}</span></div>`;
  }).join("");
  const cores = [41, 27, 63, 18].map((p, i) => `<div style="display:grid;grid-template-columns:22px 1fr 34px;gap:6px;align-items:center"><span style="color:${c.light_foreground}">C${i}</span>${meter(p, c.cyan, c.blue, c.magenta)}<span style="text-align:right">${p}%</span></div>`).join("");
  return `<div style="position:absolute;inset:2px;padding:12px 8px 8px;display:grid;grid-template-rows:150px 1fr;gap:14px;color:${c.foreground};font-size:11.5px;line-height:15px">
    <div class="bx" style="border-color:${c.magenta};display:grid;grid-template-columns:1fr 190px;gap:12px">
      ${title("¹", "cpu")}
      <div style="display:flex;align-items:flex-end;gap:1px;height:110px;margin-top:6px">${graph}</div>
      <div style="display:grid;gap:6px;align-content:start;margin-top:4px"><div style="font-weight:700">CPU 34%</div>${cores}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1.25fr;gap:8px;min-height:0">
      <div class="bx" style="border-color:${c.green};display:grid;gap:8px;align-content:start">
        ${title("²", "mem")}
        ${memRow("Used", "7.8 GiB", 52, c.green, c.cyan, c.blue)}
        ${memRow("Available", "7.1 GiB", 46, c.yellow, c.red, c.red)}
        ${memRow("Cached", "3.2 GiB", 24, c.blue, c.cyan, c.magenta)}
        ${memRow("Free", "2.4 GiB", 17, c.magenta, c.blue, c.cyan)}
      </div>
      <div class="bx" style="border-color:${c.accent};display:grid;align-content:start;gap:1px">
        ${title("⁴", "proc")}
        <div style="display:grid;grid-template-columns:44px 1fr 40px;gap:6px;padding:1px 4px;font-weight:700"><span>Pid</span><span>Program</span><span style="text-align:right">Cpu%</span></div>
        ${procRows}
      </div>
    </div>
  </div>`;
}

const ICON = {
  logo: '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="5.5" width="5" height="5" fill="currentColor"/></svg>',
  bt: '<svg viewBox="0 0 16 16"><path d="M4.5 5l6 5.5L7.8 13V3l2.7 2.5-6 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  wifi: '<svg viewBox="0 0 16 16"><path d="M1.6 6.2a9.2 9.2 0 0 1 12.8 0M4 8.8a5.8 5.8 0 0 1 8 0M6.4 11.3a2.5 2.5 0 0 1 3.2 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="13.4" r="1" fill="currentColor"/></svg>',
  vol: '<svg viewBox="0 0 16 16"><path d="M2 6h2.6L8 3.2v9.6L4.6 10H2z" fill="currentColor"/><path d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  bat: '<svg viewBox="0 0 16 16"><rect x="1" y="4.5" width="12.5" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.8" y="6.3" width="6.6" height="3.4" fill="currentColor"/><rect x="14" y="6.6" width="1.3" height="2.8" rx=".4" fill="currentColor"/></svg>',
};

/* ---------- Desktop: Hyprland gaps_out 10, gaps_in 5, border 2 ---------- */
(function render() {
  const W = 1600, H = 900, BAR = 26, GO = 10, GAP = 10;
  const top = BAR + GO, areaW = W - 2 * GO, areaH = H - top - GO;
  const colW = Math.round((areaW - GAP) * 0.52), rightW = areaW - GAP - colW, rowH = (areaH - GAP) / 2;
  const win = (x, y, w, h, active, inner) => `<div class="win" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c.background}">${inner}${ring(active ? c.hyprland_active_border : c.hyprland_inactive_border)}</div>`;
  const ws = [1, 2, 3, 4, 5].map((i) => i === 1 ? `<span><i></i></span>` : `<span style="opacity:${i <= 3 ? 1 : 0.5}">${i}</span>`).join("");
  const desk = document.getElementById("desk");
  desk.style.backgroundImage = `url("${theme.background}")`;
  desk.innerHTML = `
    <div class="bar" style="background:${c.background};color:${c.foreground}">
      ${ICON.logo}<div class="ws">${ws}</div>
      <span class="center">Monday 11:58</span>
      <div class="right">${ICON.bt}${ICON.wifi}${ICON.vol}<span style="display:flex;gap:5px;align-items:center">${ICON.bat}84%</span></div>
    </div>
    ${win(GO, top, colW, areaH, true, nvim())}
    ${win(GO + colW + GAP, top, rightW, rowH, false, terminal())}
    ${win(GO + colW + GAP, top + rowH + GAP, rightW, rowH, false, btop())}
    <div style="position:absolute;right:${GO + 8}px;top:${top + 8}px;width:340px;padding:12px 14px 16px;background:${c.background};color:${c.foreground};font-size:12.5px;line-height:17px">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 60%, #0e1f3f 0 24%, #26a6a6 25% 50%, #a24a2a 51% 62%, #bcd42a 63% 100%)"></span>
        <div style="display:grid;gap:2px"><b>Theme applied</b><span style="color:${c.dark_foreground}">${esc(theme.label)}</span></div>
        <span style="margin-left:auto;color:${c.dark_foreground};font-size:11.5px">now</span>
      </div>
      <span style="position:absolute;left:2px;bottom:2px;height:3px;width:62%;background:${c.accent}"></span>
      ${ring(c.hyprland_active_border)}
    </div>`;
})();
document.title = "done";
</script>
